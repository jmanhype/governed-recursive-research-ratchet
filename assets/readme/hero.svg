<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="grrr-hero-title grrr-hero-desc">
  <title id="grrr-hero-title">Governed Recursive Research Ratchet</title>
  <desc id="grrr-hero-desc">A governance pipeline in which an operator authorizes PAIVOT work, a bounded runner submits to an isolated candidate, an independent evaluator verifies results, and append-only evidence reaches separate human decisions.</desc>

  <rect width="1200" height="380" rx="28" fill="#0B1120"/>
  <path d="M40 56v268" stroke="#24344A" stroke-width="2"/>
  <path d="M40 92h10M40 158h10M40 224h10M40 290h10" stroke="#67E8F9" stroke-width="3"/>

  <g id="title-block" transform="translate(70 54)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="0" y="18" fill="#67E8F9" font-size="18" letter-spacing="3"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GOVERNED RESEARCH PROTOTYPE</text>
    <text x="0" y="78" fill="#E7EDF5" font-size="54" font-weight="700">Governed Recursive</text>
    <text x="0" y="134" fill="#E7EDF5" font-size="54" font-weight="700">Research Ratchet</text>
    <text x="0" y="178" fill="#98A8B8" font-size="24">Autonomous agents propose changes.</text>
    <text x="0" y="210" fill="#98A8B8" font-size="24">Independent evidence decides what is real.</text>
    <text x="0" y="242" fill="#98A8B8" font-size="24">Humans own admission and promotion.</text>

    <g id="status-chips" transform="translate(0 274)" font-size="18" font-weight="650">
      <rect width="128" height="36" rx="18" fill="#112130" stroke="#31465F"/>
      <text x="20" y="24" fill="#D7E2EE">FAIL CLOSED</text>
      <rect x="142" width="178" height="36" rx="18" fill="#112130" stroke="#31465F"/>
      <text x="160" y="24" fill="#D7E2EE">ISOLATED EXECUTION</text>
      <rect x="334" width="176" height="36" rx="18" fill="#112130" stroke="#31465F"/>
      <text x="352" y="24" fill="#D7E2EE">DURABLE EVIDENCE</text>
    </g>
  </g>

  <g id="governance-pipeline" transform="translate(654 44)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect width="486" height="292" rx="22" fill="#101A2B" stroke="#253A52"/>
    <text x="26" y="34" fill="#98A8B8" font-size="18" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TRUST PIPELINE</text>

    <g id="operator-to-runner">
      <rect x="26" y="54" width="434" height="46" rx="12" fill="#162337" stroke="#31465F"/>
      <circle cx="51" cy="77" r="7" fill="#67E8F9"/>
      <text x="70" y="72" fill="#E7EDF5" font-size="20" font-weight="650">Operator</text>
      <text x="70" y="91" fill="#98A8B8" font-size="18">explicit scoped authorization</text>
    </g>
    <path d="M243 100v20" stroke="#67E8F9" stroke-width="3"/>

    <g id="paivot-runner">
      <rect x="26" y="120" width="434" height="46" rx="12" fill="#162337" stroke="#31465F"/>
      <circle cx="51" cy="143" r="7" fill="#67E8F9"/>
      <text x="70" y="138" fill="#E7EDF5" font-size="20" font-weight="650">PAIVOT + bounded runner</text>
      <text x="70" y="157" fill="#98A8B8" font-size="18">story state and budgeted work</text>
    </g>
    <path d="M243 166v20" stroke="#67E8F9" stroke-width="3"/>

    <g id="untrusted-candidate">
      <rect x="26" y="186" width="434" height="46" rx="12" fill="#241B12" stroke="#F59E0B" stroke-dasharray="7 6"/>
      <circle cx="51" cy="209" r="7" fill="#F59E0B"/>
      <text x="70" y="204" fill="#F8D8A2" font-size="20" font-weight="650">Untrusted candidate</text>
      <text x="70" y="223" fill="#D2AE73" font-size="18">offline isolation; claims only</text>
    </g>
    <path d="M243 232v20" stroke="#67E8F9" stroke-width="3"/>

    <g id="evaluator-evidence-decision">
      <rect x="26" y="252" width="434" height="46" rx="12" fill="#122A28" stroke="#67E8F9"/>
      <circle cx="51" cy="275" r="7" fill="#67E8F9"/>
      <text x="70" y="270" fill="#E7EDF5" font-size="20" font-weight="650">Independent evaluator</text>
      <text x="70" y="289" fill="#98C7CE" font-size="18">replay → ledger → human gate</text>
    </g>
  </g>

  <text x="654" y="368" fill="#73859A" font-size="18"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claim ≠ verified defect ≠ approved contract</text>
</svg>
